general {
    gaps_in = 5
    gaps_out = 20
    gaps_workspaces = 50

    border_size = 3
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgb(a66dfc)
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    hover_icon_on_border = true

    layout = dwindle

    snap {
        enabled = true
    }
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

misc {
    allow_session_lock_restore = true
}
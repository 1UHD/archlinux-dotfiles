$mainMod = SUPER

bind = ,121, exec, pamixer -t # Speaker Mute FN+F1
bind = ,122, exec, pamixer -d 5 # Volume lower key
bind = ,123, exec, pamixer -i 5 # Volume Higher key
bind = ,256, exec, pamixer --default-source -t # Mic mute key
bind = ,232, exec, brightnessctl set 10%- # Screen brightness down FN+F7
bind = ,233, exec, brightnessctl set 10%+ # Screen brightness up FN+F8

#APPLICATIONS
bind = $mainMod, X, exec, ghostty #terminal
bind = $mainMod, SPACE, exec, wofi #wofi
bind = $mainMod SHIFT, F, exec, thunar #file explorer gui

#MISC
bind = $mainMod SHIFT, S, exec, hyprshot -m region #screenshot 

#CLIPBOARD
#bind = $mainMod, C, exec, ydotool key 29:1 46:1

bind = $mainMod SHIFT, V, exec, cliphist list | wofi -d | cliphist decode | wl-copy

#OS
bind = $mainMod SHIFT, E, exit, #exit hyprland

#WINDOW HANDLING

#window behavior
bind = $mainMod, Q, killactive, #close window
bind = $mainMod SHIFT, Q, forcekillactive #kill window
bind = $mainMod, L, togglefloating, #make window float
bind = $mainMod, F, fullscreen #make window fullscreen

bind = $mainMod, J, togglesplit, #rotate window

#illegal shenanigans (using the mouse)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize window with mainMod + arrow keys
bind = $mainMod SHIFT, left, resizeactive, -30 0
bind = $mainMod SHIFT, right, resizeactive, 30 0
bind = $mainMod SHIFT, up, resizeactive, 0 -30
bind = $mainMod SHIFT, down, resizeactive, 0 30

#WORKSPACES

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

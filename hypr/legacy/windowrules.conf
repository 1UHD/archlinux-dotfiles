layerrule = no_anim on, match:class selection
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace ghostty
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:class notifications
#this fixes hyprshot having a blurred selection screen
#also nice because 69
layerrule = ignore_alpha 0.69, match:class notifications
layerrule = blur on, match:namespace rust-muted-overlay
layerrule = blur on, match:namespace rdock

windowrule = workspace 6 silent, match:class vesktop